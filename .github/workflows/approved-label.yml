---
name: PR Approved Label

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  issues: write
  pull-requests: read

jobs:
  approved-label:
    name: Manage approved label
    runs-on: ubuntu-latest
    steps:
      - name: Add approved label
        if: github.event.review.state == 'approved'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels \
            -f 'labels[]=approved'

      - name: Remove approved label
        if: github.event.review.state == 'dismissed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only remove the label when the PR is no longer approved as a whole,
          # e.g. the dismissed approval was the only one.
          decision=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json reviewDecision --jq '.reviewDecision')
          if [ "${decision}" != "APPROVED" ]; then
            gh api --method DELETE \
              repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/approved || true
          fi
